server { # פותח בלוק הגדרות של שרת וירטואלי ב-Nginx
    listen 80; # מאזין לבקשות המגיעות לפורט 80 בתוך הקונטיינר
    server_name localhost; # מגדיר את שם השרת המקומי

    location / { # מגדיר טיפול בבקשות לנתיב הראשי של האתר
        root /usr/share/nginx/html; # מציין מאיזו תיקייה להגיש את קבצי האתר
        index index.html; # קובע שקובץ index.html הוא העמוד הראשי
    } # סוגר את בלוק location של הנתיב הראשי

    location /images/ { # מגדיר טיפול בכל בקשה לנתיב שמתחיל ב-/images/
        proxy_pass http://parking_storage:80/images/; # מעביר את הבקשה פנימית לשירות parking_storage לפורט 80
        proxy_set_header Host $host; # מעביר את שם ההוסט המקורי של הבקשה
    } # סוגר את בלוק location של התמונות
} # סוגר את בלוק ה-server
