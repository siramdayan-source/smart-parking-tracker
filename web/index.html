<!DOCTYPE html> <!-- מגדיר לדפדפן שזה מסמך HTML5 -->
<html lang="he" dir="rtl"> <!-- פותח את העמוד, מגדיר עברית וכיוון כתיבה מימין לשמאל -->
<head> <!-- פותח את אזור ה-head של העמוד -->
  <meta charset="UTF-8"> <!-- מגדיר קידוד תווים UTF-8 לתמיכה מלאה בעברית -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- מתאים את העמוד לרוחב המסך -->
  <title>לוח בקרה לשומר - חניה חכמה</title> <!-- כותרת העמוד בלשונית הדפדפן -->
  <style> <!-- פותח בלוק עיצוב CSS -->
    body { <!-- עיצוב גוף העמוד -->
      font-family: Arial, sans-serif; /* גופן קריא ופשוט */
      background-color: #f1f5f9; /* רקע אפור בהיר */
      margin: 0; /* מאפס שוליים חיצוניים */
      padding: 24px; /* מוסיף ריווח פנימי סביב התוכן */
      color: #0f172a; /* צבע טקסט כהה */
    } /* סוגר עיצוב body */
    .header { /* עיצוב סרגל הכותרת העליון */
      display: flex; /* מסדר אלמנטים בשורה */
      justify-content: space-between; /* מפריד בין הכותרת לכפתור */
      align-items: center; /* מיישר אנכית למרכז */
      margin-bottom: 20px; /* רווח תחתון לפני הכרטיסים */
      flex-wrap: wrap; /* מאפשר שבירת שורה במסכים צרים */
      gap: 12px; /* רווח בין פריטים */
    } /* סוגר עיצוב header */
    h1 { /* עיצוב כותרת ראשית */
      margin: 0 0 6px 0; /* רווח קטן מתחת לכותרת */
      font-size: 24px; /* גודל כתב כותרת */
    } /* סוגר עיצוב h1 */
    .subtitle { /* עיצוב תיאור משני */
      margin: 0; /* מאפס שוליים */
      color: #475569; /* צבע אפור כהה */
    } /* סוגר עיצוב subtitle */
    button { /* עיצוב כפתור הרענון */
      background-color: #2563eb; /* צבע כחול לכפתור */
      color: #ffffff; /* טקסט לבן על הכפתור */
      border: none; /* ללא מסגרת ברירת מחדל */
      padding: 10px 16px; /* ריווח פנימי לכפתור */
      border-radius: 8px; /* פינות מעוגלות */
      cursor: pointer; /* סמן יד בעת מעבר עכבר */
      font-size: 14px; /* גודל טקסט בכפתור */
    } /* סוגר עיצוב button */
    button:hover { /* עיצוב כפתור במעבר עכבר */
      background-color: #1d4ed8; /* כחול כהה יותר בעת ריחוף */
    } /* סוגר עיצוב hover */
    .grid { /* רשת כרטיסי הרכבים */
      display: grid; /* פריסת Grid */
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); /* עמודות גמישות לפי רוחב המסך */
      gap: 20px; /* רווח בין כרטיסים */
    } /* סוגר עיצוב grid */
    .card { /* כרטיס בודד של רכב */
      background: #ffffff; /* רקע לבן לכרטיס */
      border-radius: 12px; /* פינות מעוגלות */
      padding: 14px; /* ריווח פנימי */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); /* צל עדין */
    } /* סוגר עיצוב card */
    .card img { /* תמונת הרכב בתוך הכרטיס */
      width: 100%; /* רוחב מלא של הכרטיס */
      height: 180px; /* גובה אחיד לתמונה */
      object-fit: cover; /* חיתוך פרופורציונלי ללא עיוות */
      border-radius: 8px; /* פינות מעוגלות לתמונה */
      background-color: #e2e8f0; /* רקע זמני בזמן טעינת תמונה */
    } /* סוגר עיצוב card img */
    .caption { /* כיתוב מתחת לתמונה */
      margin-top: 10px; /* רווח מעל הכיתוב */
      font-weight: bold; /* כתב מודגש */
    } /* סוגר עיצוב caption */
    .status { /* שורת סטטוס טעינה/שגיאה */
      font-size: 13px; /* גודל כתב קטן */
      color: #64748b; /* צבע אפור */
      margin-top: 4px; /* רווח מעל הסטטוס */
    } /* סוגר עיצוב status */
  </style> <!-- סוגר בלוק CSS -->
</head> <!-- סוגר head -->
<body> <!-- פותח גוף העמוד -->
  <div class="header"> <!-- פותח סרגל עליון -->
    <div> <!-- עוטף כותרות -->
      <h1>לוח בקרה לשומר - חניה חכמה</h1> <!-- כותרת ראשית -->
      <p class="subtitle">צפייה ברכבים מתוך שרת האחסון (Storage)</p> <!-- הסבר קצר -->
    </div> <!-- סוגר עטיפת כותרות -->
    <button id="refreshBtn" type="button">רענן תמונות</button> <!-- כפתור לרענון התמונות -->
  </div> <!-- סוגר סרגל עליון -->

  <div class="grid" id="carsGrid"> <!-- מיכל כרטיסי הרכבים -->
    <div class="card"> <!-- כרטיס רכב 1 -->
      <img src="http://localhost:8081/images/car1.jpg" alt="רכב 1"> <!-- טוען car1.jpg משרת האחסון בפורט 8081 -->
      <div class="caption">כניסה #1 — car1.jpg</div> <!-- כותרת הכרטיס -->
      <div class="status">מקור: שרת אחסון</div> <!-- מידע על מקור התמונה -->
    </div> <!-- סוגר כרטיס 1 -->

    <div class="card"> <!-- כרטיס רכב 2 -->
      <img src="http://localhost:8081/images/car2.jpg" alt="רכב 2"> <!-- טוען car2.jpg משרת האחסון בפורט 8081 -->
      <div class="caption">כניסה #2 — car2.jpg</div> <!-- כותרת הכרטיס -->
      <div class="status">מקור: שרת אחסון</div> <!-- מידע על מקור התמונה -->
    </div> <!-- סוגר כרטיס 2 -->
  </div> <!-- סוגר מיכל הכרטיסים -->

  <script> <!-- פותח סקריפט JavaScript -->
    const refreshBtn = document.getElementById('refreshBtn'); // מאתר את כפתור הרענון לפי ID
    refreshBtn.addEventListener('click', () => { // מאזין ללחיצה על כפתור הרענון
      const imgs = document.querySelectorAll('#carsGrid img'); // בוחר את כל התמונות שבגריד
      imgs.forEach((img) => { // עובר על כל תמונה בנפרד
        const baseUrl = img.src.split('?')[0]; // שומר את כתובת התמונה המקורית ללא פרמטרים קודמים
        img.src = `${baseUrl}?t=${Date.now()}`; // מוסיף חותמת זמן כדי להכריח טעינה מחודשת מהשרת
      }); // מסיים לולאת רענון
    }); // מסיים מאזין לחיצה

    document.querySelectorAll('#carsGrid img').forEach((img) => { // מוסיף בדיקת שגיאת טעינה לכל תמונה
      img.addEventListener('error', () => { // מופעל אם התמונה לא נטענה משרת האחסון
        const statusEl = img.parentElement.querySelector('.status'); // מאתר את שורת הסטטוס בכרטיס
        if (statusEl) statusEl.textContent = 'שגיאה בטעינת תמונה משרת האחסון'; // מעדכן הודעת שגיאה ברורה
      }); // מסיים טיפול בשגיאה
    }); // מסיים לולאת בדיקת שגיאות
  </script> <!-- סוגר סקריפט -->
</body> <!-- סוגר body -->
</html> <!-- סוגר html -->
