<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Smart Parking - לוח בקרה לשומר</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 30px; }
    h1 { color: #1a202c; margin-bottom: 6px; }
    p { color: #4a5568; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
    .card { background: white; border-radius: 10px; padding: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; }
    .label { margin-top: 10px; font-weight: bold; font-size: 16px; color: #2d3748; }
  </style>
</head>
<body>
  <h1>מערכת ניהול חניון חכם – לוח בקרה לשומר</h1>
  <p>תצוגת רכבים נכנסים מתוך שרת האחסון (Apache + Docker Volume)</p>

  <div class="grid">
    <div class="card">
      <img src="/parking-images/car1.jpg" alt="רכב 1" />
      <div class="label">כניסה #1 – לוחית רישוי (car1.jpg)</div>
    </div>
    <div class="card">
      <img src="/parking-images/car2.jpg" alt="רכב 2" />
      <div class="label">כניסה #2 – לוחית רישוי (car2.jpg)</div>
    </div>
  </div>
</body>
</html>
