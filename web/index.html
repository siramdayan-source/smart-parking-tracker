<!DOCTYPE html> <!-- מגדיר לדפדפן שזה מסמך HTML5 תקני -->
<html lang="he" dir="rtl"> <!-- פותח את המסמך ומגדיר עברית וכיוון כתיבה מימין לשמאל -->
<head> <!-- פותח את אזור ההגדרות והעיצוב של העמוד -->
  <meta charset="UTF-8"> <!-- מגדיר קידוד תווים UTF-8 לתמיכה מלאה בעברית -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- מתאים את העמוד לכל גודל מסך (מחשב, טאבלט ונייד) -->
  <title>לוח בקרה לשומר - מושיק עפיה</title> <!-- מגדיר את הכותרת שמופיעה בלשונית הדפדפן -->
  <style> /* פותח בלוק עיצוב CSS שבו כל שורה מוסברת בהערה */
    :root { /* מגדיר משתני עיצוב מרכזיים בסגנון פחם רך (Soft Dark / Slate) */
     --bg-main: #1b222c; /* צבע רקע ראשי אפור פחם כהה ורגוע */
      --surface-1: #232c38; /* צבע משטח ראשון לסרגלים וקוביות סטטיסטיקה */
      --surface-2: #2a3544; /* צבע משטח שני לכרטיסי הרכבים */
      --surface-hover: #323f50; /* צבע משטח בעת מעבר עכבר על אלמנטים */
      --border: #3a4759; /* צבע גבול עדין שמפריד בין אלמנטים */
      --text-primary: #f1f5f9; /* צבע טקסט ראשי בהיר וברור */
      --text-secondary: #9fb0c7; /* צבע טקסט משני אפור בהיר */
      --accent: #3b82f6; /* צבע הדגשה ראשי כחול רגוע */
      --accent-hover: #2563eb; /* צבע כחול מעט כהה יותר בעת ריחוף עכבר */
      --success: #22c55e; /* צבע ירוק לסטטוס מאושר ומחובר */
      --success-bg: rgba(34, 197, 94, 0.16); /* רקע ירוק שקוף לתגית סטטוס מאושר */
      --warning: #f59e0b; /* צבע כתום/ענבר לסטטוס ממתין */
      --warning-bg: rgba(245, 158, 11, 0.16); /* רקע כתום שקוף לתגית ממתין */
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.28); /* צל רך ועמוק לכרטיסים וסרגלים */
    } /* סוגר בלוק משתני :root */

    * { /* בוחר את כל האלמנטים בדף */
      box-sizing: border-box; /* כולל padding ו-border בתוך הרוחב והגובה הכוללים של האלמנט */
    } /* סוגר בחירת כל האלמנטים */

    body { /* מגדיר עיצוב לכל גוף הדף */
      margin: 0; /* מאפס שוליים חיצוניים של הדפדפן */
      min-height: 100vh; /* מבטיח שהרקע יכסה לפחות את כל גובה המסך */
      padding: 24px; /* מוסיף ריווח פנימי סביב תוכן הדף */
      font-family: "Segoe UI", Arial, sans-serif; /* קובע פונט מודרני ונקי לעברית */
      background-color: var(--bg-main); /* מחיל את רקע הפחם הרך */
      color: var(--text-primary); /* מחיל את צבע הטקסט הראשי */
    } /* סוגר עיצוב body */

    .app { /* מיכל ראשי שמכיל וממרכז את כל רכיבי לוח הבקרה */
      max-width: 1160px; /* מגביל רוחב מקסימלי לקריאות נוחה */
      margin: 0 auto; /* ממרכז את המיכל אופקית במרכז המסך */
    } /* סוגר עיצוב .app */

    .topbar { /* סרגל עליון מודרני ללוגו, שם השומר, שעון וכפתור הדמיה */
      display: flex; /* מסדר את הרכיבים בסרגל בשורה גמישה */
      justify-content: space-between; /* מפריד בין צד ימין לצד שמאל בסרגל */
      align-items: center; /* מיישר את הרכיבים אנכית לקו האמצע */
      flex-wrap: wrap; /* מאפשר ירידת שורה אוטומטית במסכים צרים */
      gap: 16px; /* מוסיף רווח בין הפריטים בסרגל העליון */
      background-color: var(--surface-1); /* צבע רקע כהה לסרגל העליון */
      border: 1px solid var(--border); /* מסגרת דקה ועדינה לסרגל */
      border-radius: 16px; /* פינות מעוגלות לסרגל העליון */
      padding: 16px 22px; /* ריווח פנימי בתוך הסרגל */
      box-shadow: var(--shadow); /* מוסיף צל רך לסרגל */
      margin-bottom: 18px; /* רווח תחתון לפני שורת הסטטיסטיקות */
    } /* סוגר עיצוב .topbar */

    .brand { /* עוטף את הלוגו ואת פרטי השומר בצד ימין */
      display: flex; /* מסדר את הלוגו והטקסט זה לצד זה */
      align-items: center; /* מיישר אנכית את הלוגו והטקסט */
      gap: 12px; /* רווח בין סמל הלוגו לטקסט */
    } /* סוגר עיצוב .brand */

    .logo { /* סמל הלוגו (האות P) של מערכת החניה */
      width: 42px; /* רוחב סמל הלוגו */
      height: 42px; /* גובה סמל הלוגו */
      border-radius: 12px; /* פינות מעוגלות ללוגו */
      background-color: var(--accent); /* צבע רקע כחול ללוגו */
      color: #ffffff; /* צבע טקסט לבן בתוך הלוגו */
      display: flex; /* מאפשר מרכוז מדויק של האות P */
      align-items: center; /* ממרכז אנכית את האות P */
      justify-content: center; /* ממרכז אופקית את האות P */
      font-weight: 800; /* עובי גופן מודגש מאוד ללוגו */
      font-size: 20px; /* גודל האות בלוגו */
    } /* סוגר עיצוב .logo */

    .guard-name { /* שורת שם השומר המודגשת */
      font-size: 18px; /* גודל כתב לשם השומר */
      font-weight: 700; /* עובי כתב מודגש */
      margin: 0; /* מאפס שוליים */
    } /* סוגר עיצוב .guard-name */

    .system-sub { /* כיתוב משני קטן מתחת לשם השומר */
      font-size: 13px; /* גודל כתב קטן */
      color: var(--text-secondary); /* צבע אפור בהיר */
      margin: 2px 0 0 0; /* רווח קטן מעל הכיתוב המשני */
    } /* סוגר עיצוב .system-sub */

    .topbar-left { /* עוטף את השעון ואת כפתור הוספת הרכב בצד שמאל */
      display: flex; /* מסדר את השעון והכפתור בשורה */
      align-items: center; /* מיישר אנכית את השעון והכפתור */
      gap: 12px; /* רווח בין השעון לכפתור */
    } /* סוגר עיצוב .topbar-left */

    .clock-box { /* תיבת תצוגת השעה והתאריך העדכניים */
      background-color: var(--surface-2); /* רקע כהה מעט יותר לתצוגת השעון */
      border: 1px solid var(--border); /* מסגרת דקה סביב השעון */
      padding: 9px 14px; /* ריווח פנימי בתיבת השעון */
      border-radius: 10px; /* פינות מעוגלות לשעון */
      font-size: 13px; /* גודל כתב של השעון */
      color: var(--text-secondary); /* צבע אפור בהיר */
      font-variant-numeric: tabular-nums; /* שומר על רוחב קבוע לספרות השעון כדי שלא יקפצו */
    } /* סוגר עיצוב .clock-box */

    .btn { /* עיצוב בסיסי משותף לכל הכפתורים בממשק */
      border: 1px solid transparent; /* מגדיר מסגרת בסיסית לכפתור */
      border-radius: 10px; /* פינות מעוגלות לכפתור */
      padding: 10px 16px; /* ריווח פנימי נוח ללחיצה */
      font-size: 14px; /* גודל כתב בכפתור */
      font-weight: 600; /* עובי גופן חצי מודגש */
      cursor: pointer; /* משנה את סמן העכבר ליד לוחצת */
      transition: background-color 0.2s ease, transform 0.15s ease; /* מעבר חלק בעת לחיצה וריחוף */
    } /* סוגר עיצוב .btn */

    .btn:active { /* מצב לחיצה בפועל על כפתור */
      transform: scale(0.98); /* מכווץ מעט את הכפתור בעת לחיצה לתחושת לחיצה פיזית */
    } /* סוגר עיצוב .btn:active */

    .btn-primary { /* עיצוב כפתור ראשי כחול ("+ הדמיית רכב חדש") */
      background-color: var(--accent); /* צבע כחול ראשי */
      color: #ffffff; /* טקסט לבן */
    } /* סוגר עיצוב .btn-primary */

    .btn-primary:hover { /* מצב ריחוף עכבר מעל כפתור ראשי */
      background-color: var(--accent-hover); /* משנה לכחול כהה יותר */
    } /* סוגר עיצוב .btn-primary:hover */

    .stats-row { /* שורת שלוש קוביות הסטטיסטיקה של החניון */
      display: grid; /* מסדר את קוביות הסטטיסטיקה ברשת גמישה */
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); /* יוצר עמודות שוות שמתאימות לרוחב המסך */
      gap: 14px; /* רווח בין קוביות הסטטיסטיקה */
      margin-bottom: 18px; /* רווח תחתון לפני סרגל החיפוש והסינון */
    } /* סוגר עיצוב .stats-row */

    .stat-card { /* קובייה בודדת לנתון סטטיסטי */
      background-color: var(--surface-1); /* רקע פחם רך לקובייה */
      border: 1px solid var(--border); /* מסגרת דקה לקובייה */
      border-radius: 14px; /* פינות מעוגלות */
      padding: 14px 18px; /* ריווח פנימי */
      display: flex; /* מסדר כותרת וערך בשורה */
      justify-content: space-between; /* מפריד בין שם הנתון לערך שלו */
      align-items: center; /* מיישר אנכית למרכז */
    } /* סוגר עיצוב .stat-card */

    .stat-label { /* כיתוב שם הנתון הסטטיסטי */
      color: var(--text-secondary); /* צבע אפור בהיר */
      font-size: 14px; /* גודל כתב */
    } /* סוגר עיצוב .stat-label */

    .stat-value { /* ערך הנתון הסטטיסטי */
      font-weight: 700; /* טקסט מודגש */
      font-size: 16px; /* גודל כתב מודגש */
    } /* סוגר עיצוב .stat-value */

    .status-dot-wrap { /* עוטף נקודת חיווי ירוקה וטקסט סטטוס שרת האחסון */
      display: inline-flex; /* מסדר נקודה וטקסט בשורה צמודה */
      align-items: center; /* מיישר אנכית את הנקודה והטקסט */
      gap: 8px; /* רווח בין הנקודה הירוקה לטקסט */
      color: var(--success); /* צבע ירוק */
      font-weight: 700; /* טקסט מודגש */
    } /* סוגר עיצוב .status-dot-wrap */

    .dot { /* נקודת חיווי עגולה */
      width: 10px; /* רוחב הנקודה */
      height: 10px; /* גובה הנקודה */
      border-radius: 50%; /* הופך את האלמנט לעיגול מושלם */
      background-color: var(--success); /* צבע ירוק לנקודה */
    } /* סוגר עיצוב .dot */

    .controls-bar { /* סרגל חיפוש לוחית רישוי וכפתורי סינון */
      display: flex; /* מסדר חיפוש וכפתורי סינון בשורה גמישה */
      justify-content: space-between; /* מפריד בין תיבת החיפוש לכפתורי הסינון */
      align-items: center; /* מיישר אנכית למרכז */
      flex-wrap: wrap; /* מאפשר שבירת שורה במסכים צרים */
      gap: 12px; /* רווח בין הפריטים בסרגל */
      background-color: var(--surface-1); /* רקע פחם רך */
      border: 1px solid var(--border); /* מסגרת דקה */
      border-radius: 14px; /* פינות מעוגלות */
      padding: 14px 18px; /* ריווח פנימי */
      margin-bottom: 22px; /* רווח תחתון לפני גריד הכרטיסים */
    } /* סוגר עיצוב .controls-bar */

    .search-input { /* תיבת הטקסט לחיפוש לפי מספר לוחית רישוי */
      flex: 1; /* מאפשר לתיבת החיפוש לתפוס מקום פנוי בשורה */
      min-width: 240px; /* רוחב מינימלי כדי שהתיבה תישאר נוחה לקריאה */
      background-color: var(--surface-2); /* רקע כהה בתוך תיבת החיפוש */
      border: 1px solid var(--border); /* מסגרת עדינה סביב התיבה */
      border-radius: 10px; /* פינות מעוגלות */
      padding: 10px 14px; /* ריווח פנימי */
      color: var(--text-primary); /* צבע טקסט בהיר בעת הקלדה */
      font-size: 14px; /* גודל כתב */
      outline: none; /* מסיר קו מתאר ברירת מחדל של הדפדפן */
    } /* סוגר עיצוב .search-input */

    .search-input:focus { /* הדגשת מסגרת תיבת החיפוש בזמן הקלדה */
      border-color: var(--accent); /* משנה את צבע המסגרת לכחול בעת פוקוס */
    } /* סוגר עיצוב .search-input:focus */

    .filter-group { /* קבוצת כפתורי הסינון ("הכל" / "אושר") */
      display: flex; /* מסדר את כפתורי הסינון בשורה */
      gap: 8px; /* רווח בין כפתורי הסינון */
    } /* סוגר עיצוב .filter-group */

    .filter-btn { /* כפתור סינון בודד */
      background-color: var(--surface-2); /* רקע כהה לכפתור סינון לא פעיל */
      color: var(--text-secondary); /* טקסט אפור בהיר */
      border: 1px solid var(--border); /* מסגרת דקה */
      border-radius: 10px; /* פינות מעוגלות */
      padding: 9px 16px; /* ריווח פנימי */
      font-size: 14px; /* גודל כתב */
      font-weight: 600; /* עובי גופן */
      cursor: pointer; /* סמן יד בעת מעבר עכבר */
    } /* סוגר עיצוב .filter-btn */

    .filter-btn.active { /* עיצוב כפתור הסינון הפעיל כרגע */
      background-color: var(--accent); /* רקע כחול לכפתור נבחר */
      color: #ffffff; /* טקסט לבן */
      border-color: var(--accent); /* מסגרת תואמת */
    } /* סוגר עיצוב .filter-btn.active */

    .cars-grid { /* גריד דו-טורי לכרטיסי הרכבים */
      display: grid; /* מפעיל פריסת Grid */
      grid-template-columns: repeat(2, minmax(0, 1fr)); /* מגדיר שתי עמודות שוות רוחב במסכי מחשב */
      gap: 20px; /* רווח בין הכרטיסים בגריד */
    } /* סוגר עיצוב .cars-grid */

    @media (max-width: 820px) { /* התאמה למסכים צרים מתחת ל-820 פיקסלים */
      .cars-grid { /* בוחר את הגריד במסך צר */
        grid-template-columns: 1fr; /* הופך לעמודה אחת כדי שהכרטיסים יישארו גדולים וקריאים */
      } /* סוגר שינוי עמודות במסך צר */
    } /* סוגר בלוק @media */

    .car-card { /* כרטיס בודד עבור רכב שנכנס לחניון */
      background-color: var(--surface-2); /* רקע פחם כהה לכרטיס */
      border: 1px solid var(--border); /* מסגרת עדינה לכרטיס */
      border-radius: 16px; /* פינות מעוגלות */
      padding: 16px; /* ריווח פנימי בכרטיס */
      box-shadow: var(--shadow); /* צל רך לכרטיס */
      display: flex; /* מסדר את תוכן הכרטיס בעמודה אנכית */
      flex-direction: column; /* קובע סידור מלמעלה למטה בתוך הכרטיס */
      gap: 14px; /* רווח בין התמונה, הפרטים וכפתור המחסום */
      transition: transform 0.2s ease, border-color 0.2s ease; /* מעבר חלק בעת ריחוף */
    } /* סוגר עיצוב .car-card */

    .car-card:hover { /* מצב ריחוף עכבר מעל כרטיס רכב */
      transform: translateY(-3px); /* מרים מעט את הכרטיס כלפי מעלה */
      border-color: var(--accent); /* מדגיש את מסגרת הכרטיס בכחול */
    } /* סוגר עיצוב .car-card:hover */

    .img-box { /* מסגרת עוטפת לתמונת הרכב ולכפתור ההגדלה */
      position: relative; /* מאפשר מיקום אבסולוטי של אייקון הזכוכית המגדלת בפינה */
      height: 195px; /* גובה קבוע ואחיד לתמונות הרכבים */
      border-radius: 12px; /* פינות מעוגלות למסגרת התמונה */
      overflow: hidden; /* חותך חלקים חורגים לשמירה על פינות מעוגלות */
      background-color: #151b22; /* רקע כהה זמני בזמן טעינת תמונה */
      cursor: zoom-in; /* מציג סמן זכוכית מגדלת (+) בעת מעבר על התמונה */
    } /* סוגר עיצוב .img-box */

    .img-box img { /* תמונת הרכב/לוחית הרישוי עצמה */
      width: 100%; /* רוחב מלא של המסגרת */
      height: 100%; /* גובה מלא של המסגרת */
      object-fit: cover; /* ממלא את המסגרת יפה ושומר על פרופורציות התמונה */
      display: block; /* מונע רווח מיותר מתחת לתמונה */
    } /* סוגר עיצוב .img-box img */

    .zoom-badge { /* אייקון זכוכית מגדלת קטן בפינת התמונה */
      position: absolute; /* ממקם את האייקון בפינה בתוך .img-box */
      bottom: 10px; /* מרחק של 10 פיקסלים מהתחתית */
      left: 10px; /* מרחק של 10 פיקסלים מצד שמאל */
      background-color: rgba(15, 23, 42, 0.8); /* רקע כהה חצי שקוף לקריאות על כל תמונה */
      color: #ffffff; /* צבע לבן לאייקון */

  <script> // פותח סקריפט JavaScript שבו כל שורה מוסברת בהערה
    const TOTAL_PARKING_SPOTS = 50; // מגדיר קיבולת כוללת של 50 מקומות חניה לחישוב מקומות פנויים
    let currentFilter = 'all'; // שומר את מצב הסינון הנוכחי ('all' לכל הרכבים או 'approved' למאושרים בלבד)
    let entryCounter = 2; // שומר מונה כניסות שמתחיל מ-2 עבור שני הרכבים הקיימים

    function updateClock() { // פונקציה שמעדכנת את השעה והתאריך בסרגל העליון
      const now = new Date(); // יוצר אובייקט זמן עדכני מהמחשב
      const timeStr = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); // מפרמט את השעה העברית (שעות, דקות ושניות)
      const dateStr = now.toLocaleDateString('he-IL'); // מפרמט את התאריך העברי של היום
      document.getElementById('clockBox').textContent = `${timeStr} | ${dateStr}`; // מציב את השעה והתאריך בתוך תיבת השעון
    } // סוגר פונקציית updateClock

    function updateStats() { // פונקציה שמחשבת ומעדכנת את סך הרכבים והמקומות הפנויים
      const cardsCount = document.querySelectorAll('#carsGrid .car-card').length; // סופר כמה כרטיסי רכבים קיימים כרגע בדף
      const freeSpots = Math.max(TOTAL_PARKING_SPOTS - cardsCount, 0); // מחשב כמה מקומות פנויים נותרו בלי לרדת מתחת ל-0
      document.getElementById('totalCarsCount').textContent = String(cardsCount); // מעדכן את קובץ "סה"כ רכבים בחניון"
      document.getElementById('freeSpotsCount').textContent = String(freeSpots); // מעדכן את קוביית "מקומות פנויים"
    } // סוגר פונקציית updateStats

    function applyFilters() { // פונקציה שמסננת כרטיסים לפי טקסט החיפוש ולפי כפתור הסינון
      const query = document.getElementById('searchInput').value.trim().toLowerCase(); // קורא את טקסט החיפוש ומנקה רווחים מיותרים
      const cards = document.querySelectorAll('#carsGrid .car-card'); // בוחר את כל כרטיסי הרכבים בגריד
      cards.forEach((card) => { // עובר על כל כרטיס בנפרד
        const plate = (card.dataset.plate || '').toLowerCase(); // קורא את מספר הלוחית השמור בכרטיס
        const status = card.dataset.status || 'approved'; // קורא את סטטוס הרכב השמור בכרטיס
        const matchesSearch = !query || plate.includes(query); // בודק אם מספר הלוחית תואם לחיפוש (או שאין חיפוש)
        const matchesFilter = currentFilter === 'all' || status === currentFilter; // בודק אם הכרטיס מתאים לבחירת הסינון הנוכחית
        card.style.display = matchesSearch && matchesFilter ? 'flex' : 'none'; // מציג את הכרטיס אם עמד בשני התנאים או מסתיר אותו
      }); // סוגר לולאת הסינון
    } // סוגר פונקציית applyFilters

    function toggleBarrier(buttonEl) { // פונקציה שמופעלת בלחיצה על כפתור "פתח מחסום"
      const card = buttonEl.closest('.car-card'); // מאתר את כרטיס הרכב שאליו שייך הכפתור שנלחץ
      const badge = card.querySelector('[data-status-badge]'); // מאתר את תגית הסטטוס בתוך הכרטיס
      card.dataset.status = 'approved'; // מעדכן את נתון הסטטוס של הכרטיס ל-"approved"
      badge.textContent = 'אושר'; // מעדכן את טקסט התגית ל-"אושר"
      badge.classList.remove('badge-pending'); // מסיר עיצוב של ממתין אם היה קיים
      badge.classList.add('badge-approved'); // מחיל עיצוב סטטוס ירוק ("אושר")
      buttonEl.textContent = 'המחסום נפתח ✓'; // מעדכן את טקסט הכפתור לחיווי שהמחסום נפתח
    } // סוגר פונקציית toggleBarrier

    function openLightbox(imgSrc, captionText) { // פונקציה שפותחת את התמונה המוגדלת בלחיצה
      document.getElementById('lightboxImg').src = imgSrc; // מציב את כתובת התמונה המוגדלת
      document.getElementById('lightboxCaption').textContent = captionText; // מציב את הכיתוב המלווה לתמונה המוגדלת
      document.getElementById('lightboxModal').classList.add('open'); // מציג את חלון ההגדלה על המסך
    } // סוגר פונקציית openLightbox

    function closeLightbox() { // פונקציה שסוגרת את חלון התמונה המוגדלת
      document.getElementById('lightboxModal').classList.remove('open'); // מסתיר את חלון ההגדלה
    } // סוגר פונקציית closeLightbox

    function closeLightboxOnBackdrop(event) { // פונקציה שסוגרת את ההגדלה אם לוחצים על הרקע הכהה מחוץ לתמונה
      if (event.target.id === 'lightboxModal') { // בודק שהלחיצה הייתה על הרקע הכהה ולא על התמונה עצמה
        closeLightbox(); // סוגר את חלון ההגדלה
      } // סוגר בדיקת רקע
    } // סוגר פונקציית closeLightboxOnBackdrop

    document.getElementById('simulateCarBtn').addEventListener('click', () => { // מאזין ללחיצה על "+ הדמיית רכב חדש"
      entryCounter += 1; // מקדם את מספר הכניסה הבא ב-1
      const now = new Date(); // לוקח את השעה הנוכחית של הכניסה החדשה
      const hhmm = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); // מפרמט את השעה לפורמט שעות:דקות
      const samplePlates = ['78-412-34', '90-221-55', '14-889-62', '63-504-19']; // רשימת לוחיות רישוי לדוגמה להדמיה
      const sampleImgs = ['images/car1.jpg', 'images/car2.jpg']; // רשימת התמונות הקיימות בשרת האחסון
      const plate = samplePlates[(entryCounter - 1) % samplePlates.length]; // בוחר לוחית רישוי מתוך הרשימה
      const imgPath = sampleImgs[(entryCounter - 1) % sampleImgs.length]; // בוחר תמונה מתוך תמונות הרכבים הקיימות
      const article = document.createElement('article'); // יוצר אלמנט כרטיס חדש עבור הרכב החדש
      article.className = 'car-card'; // מחיל עליו את מחלקת העיצוב של כרטיס רכב
      article.dataset.plate = plate; // שומר את מספר הלוחית לשימוש בחיפוש
      article.dataset.status = 'pending'; // מגדיר את הרכב החדש כ-"ממתין" עד לאישור פתיחת מחסום
      article.innerHTML = `
        <div class="img-box" onclick="openLightbox('${imgPath}', 'כניסה מס׳ ${entryCounter} • לוחית רישוי: ${plate}')">
          <img src="${imgPath}" alt="תמונת רכב כניסה ${entryCounter}">
          <span class="zoom-badge">🔍 הגדל</span>
        </div>
        <div class="car-details">
          <h2 class="entry-title">כניסה מס' ${entryCounter}</h2>
          <p class="detail-line">שעת כניסה: <strong>${hhmm}</strong></p>
          <p class="detail-line">לוחית רישוי: <strong>${plate}</strong></p>
          <div class="status-row">
            <span class="badge badge-pending" data-status-badge>ממתין</span>
          </div>
        </div>
        <button class="barrier-btn" type="button" onclick="toggleBarrier(this)">פתח מחסום</button>
      `; // מכניס את מבנה הכרטיס המלא עם כל הפרטים וכפתור פתיחת המחסום
      document.getElementById('carsGrid').prepend(article); // מוסיף את הכרטיס החדש בראש הגריד כך שיראו אותו מיד
      updateStats(); // מעדכן את קוביות הסטטיסטיקה ("סה"כ רכבים בחניון" ו-"מקומות פנויים")
      applyFilters(); // מפעיל מחדש את הסינון/חיפוש כדי שהכרטיס החדש יכבד את הבחירה הנוכחית
    }); // סוגר מאזין ללחיצה על הדמיית רכב חדש

    document.getElementById('searchInput').addEventListener('input', applyFilters); // מפעיל סינון מיידי בכל הקלדה בתיבת החיפוש

    document.getElementById('filterAllBtn').addEventListener('click', () => { // מאזין ללחיצה על כפתור הסינון "הכל"
      currentFilter = 'all'; // מעדכן את מצב הסינון ל-"הכל"
      document.getElementById('filterAllBtn').classList.add('active'); // מסמן את כפתור "הכל" כפעיל
      document.getElementById('filterApprovedBtn').classList.remove('active'); // מסיר סימון פעיל מכפתור "אושר"
      applyFilters(); // מעדכן את תצוגת הכרטיסים בהתאם לבחירה
    }); // סוגר מאזין לכפתור "הכל"

    document.getElementById('filterApprovedBtn').addEventListener('click', () => { // מאזין ללחיצה על כפתור הסינון "אושר"
      currentFilter = 'approved'; // מעדכן את מצב הסינון ל-"אושר"
      document.getElementById('filterApprovedBtn').classList.add('active'); // מסמן את כפתור "אושר" כפעיל
      document.getElementById('filterAllBtn').classList.remove('active'); // מסיר סימון פעיל מכפתור "הכל"
      applyFilters(); // מעדכן את תצוגת הכרטיסים בהתאם לבחירה
    }); // סוגר מאזין לכפתור "אושר"

    updateClock(); // מפעיל עדכון ראשוני של השעון מיד עם טעינת העמוד
    setInterval(updateClock, 1000); // מפעיל עדכון אוטומטי של השעון כל שנייה (1000 מילי-שניות)
    updateStats(); // מחשב ומציג את הנתונים הסטטיסטיים הראשוניים בעת טעינת העמוד
  </script> <!-- סוגר בלוק ה-JavaScript -->
</body> <!-- סוגר את גוף העמוד -->
</html> <!-- סוגר את מסמך ה-HTML -->
